<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shy-notes</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="chrome" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>shy-notes</span>
        <button id="pin-btn" class="icon-btn" type="button" title="Pin / Unpin" aria-pressed="false">○</button>
      </header>
      <textarea
        id="editor"
        class="editor"
        spellcheck="true"
        placeholder="Write freely…"
        aria-label="Note"
      ></textarea>
      <div id="a11y" class="a11y hidden" role="dialog" aria-labelledby="a11y-title">
        <p id="a11y-title"><strong>Accessibility permission needed</strong></p>
        <p>
          shy-notes needs Accessibility access to track the cursor and gently move aside.
          Open System Settings, enable shy-notes, then return here.
        </p>
        <div class="a11y-actions">
          <button id="a11y-open" type="button">Open System Settings</button>
          <button id="a11y-dismiss" type="button" class="ghost">Dismiss</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
